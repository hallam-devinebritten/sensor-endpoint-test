version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/envs/dev"
      - "/infra/envs/prod"
      - "/infra/modules/api"
    schedule:
      interval: "weekly"