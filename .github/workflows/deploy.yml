name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test and build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          pip install -r app/requirements-dev.txt
          pytest -v

      - name: Build Lambda package
        run: |
          mkdir -p dist
          zip -j dist/lambda.zip app/src/*.py

      - name: Store package for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist/lambda.zip

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v7

      - name: Get the package built earlier
        uses: actions/download-artifact@v8
        with:
          name: lambda-package
          path: dist

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var="app_version=${{ github.sha }}"

      - name: Terraform apply (exactly the saved plan)
        run: terraform apply -input=false tfplan

      - name: Smoke test
        run: |
          API_URL=$(terraform output -raw api_url)
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$API_URL/health" | grep -q "${{ github.sha }}"; then
              echo "Smoke test passed: new version is live in dev"
              exit 0
            fi
            echo "Attempt $attempt: not live yet, waiting..."
            sleep 5
          done
          echo "Smoke test failed: /health did not report version ${{ github.sha }}"
          exit 1

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v7

      - name: Get the SAME package that went to dev
        uses: actions/download-artifact@v8
        with:
          name: lambda-package
          path: dist

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var="app_version=${{ github.sha }}"

      - name: Terraform apply (exactly the saved plan)
        run: terraform apply -input=false tfplan

      - name: Smoke test
        run: |
          API_URL=$(terraform output -raw api_url)
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$API_URL/health" | grep -q "${{ github.sha }}"; then
              echo "Smoke test passed: new version is live in prod"
              exit 0
            fi
            echo "Attempt $attempt: not live yet, waiting..."
            sleep 5
          done
          echo "Smoke test failed: /health did not report version ${{ github.sha }}"
          exit 1