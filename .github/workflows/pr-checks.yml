name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: pytest -v

  terraform-plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Build Lambda package
        working-directory: .
        run: |
          mkdir -p dist
          zip -j dist/lambda.zip app/src/*.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var="app_version=${{ github.sha }}" | tee plan.txt

      - name: Show plan in the run summary
        if: always()
        run: |
          echo '### Terraform plan (dev)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f plan.txt ]; then cat plan.txt; else echo "No plan was produced - see the failed step above."; fi >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"